[tool.poetry]
name = "qc-research-data"
version = "0.1.0"
description = "Loads newsletters, news digests, Benzinga headlines, FinBERT sentiment, daily prices, options metrics, split and dividend factors and a market news sentiment index into Supabase as a model-training dataset"
authors = ["QuantConnect IB Workspace Contributors"]
readme = "README.md"
packages = [{ include = "research_data" }]

[tool.poetry.scripts]
research-data = "research_data.cli:main"

[tool.poetry.dependencies]
python = "^3.10"
qc-multi-llm = { path = "../multi-llm", develop = true }
torch = { version = ">=2.6", optional = true }
transformers = { version = ">=4.48", optional = true }
openbb-federal-reserve = { version = ">=2.0", optional = true }

[tool.poetry.extras]
local = ["torch", "transformers"]
openbb = ["openbb-federal-reserve"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
