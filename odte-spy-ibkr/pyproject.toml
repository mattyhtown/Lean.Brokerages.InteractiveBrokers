[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odte-spy-ibkr"
version = "0.1.0"
description = "0DTE SPY options trading scaffold via Interactive Brokers with Unusual Whales flow gating"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ib_insync>=0.9.86",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
odte-spy-ibkr = "odte_spy_ibkr.runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["odte_spy_ibkr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]